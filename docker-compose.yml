services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-food-donations-api:latest}
    container_name: food-donations-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-32-bytes-minimum-length-abc123}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
